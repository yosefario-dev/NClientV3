apply plugin: 'com.android.application'

android {
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }
    signingConfigs {
        release {
            storeFile file('../nclientv3-release.keystore')
            storePassword System.getenv('STORE_PASSWORD') ?: 'nclientv3'
            keyAlias System.getenv('KEY_ALIAS') ?: 'nclientv3'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'nclientv3'
        }
    }
    defaultConfig {
        applicationId "com.yosefario.nclientv3"
        minSdk 26
        targetSdk 35
        versionCode 425
        versionName "4.3.0"
        vectorDrawables.useSupportLibrary true
        proguardFiles 'proguard-rules.pro'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            versionNameSuffix "-release"
            resValue "string", "app_name", "NClientV3"
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "NClientV3 Debug"
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/*.so']
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace 'com.yosefario.nclientv3'
}

dependencies {
    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // AndroidX UI
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.mozilla.geckoview:geckoview-omni:158.0.20261021001904'

    // Material Design 3
    implementation 'com.google.android.material:material:1.12.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.4'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.12.0'
    implementation 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    implementation 'org.jsoup:jsoup:1.18.1'

    // Image Loading
    implementation('com.github.bumptech.glide:glide:4.16.0') {
        exclude group: "com.android.support"
    }
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    // Custom OkHttp integration in components/classes/integration/ replaces library module
    // to share cookies & interceptors with main app OkHttpClient

    // PhotoView (replace vendored copy)
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'


    // UI Extras
    implementation 'com.github.yukuku:ambilwarna:2.0.1'
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'
    implementation 'com.zeugmasolutions.localehelper:locale-helper-android:1.5.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jsoup:jsoup:1.17.2'
}
