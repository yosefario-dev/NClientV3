pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        exclusiveContent {
            forRepository { mavenLocal() }
            filter {
                includeGroup "org.mozilla.geckoview"
                includeGroup "org.microg.gms"
            }
        }
    }
}
rootProject.name = "NClientV3"
include ':app'
